<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types vaultnote">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>VaultNote</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== [TOKENS] PRD 11장 애플 앱 스타일 ===== */
:root {
  --accent: #007AFF;
  --danger: #FF3B30;
  --bg: #F2F2F7;
  --cell: #FFFFFF;
  --label: #000000;
  --label2: rgba(60, 60, 67, 0.6);
  --label3: rgba(60, 60, 67, 0.3);
  --sep: rgba(60, 60, 67, 0.29);
  --fill: rgba(118, 118, 128, 0.12);
  --bar: rgba(249, 249, 249, 0.82);
  --pressed: #D1D1D6;
  --sheet: #FFFFFF;
  --toast: rgba(28, 28, 30, 0.94);
  --dim: rgba(0, 0, 0, 0.4);
  --fill2: rgba(120, 120, 128, 0.16);
  --green: #34C759;
  --orange: #FF9500;
  --font: -apple-system, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #0A84FF;
    --danger: #FF453A;
    --bg: #000000;
    --cell: #1C1C1E;
    --label: #FFFFFF;
    --label2: rgba(235, 235, 245, 0.6);
    --label3: rgba(235, 235, 245, 0.3);
    --sep: rgba(84, 84, 88, 0.65);
    --fill: rgba(118, 118, 128, 0.24);
    --bar: rgba(22, 22, 24, 0.82);
    --pressed: #2C2C2E;
    --sheet: #2C2C2E;
    --toast: rgba(58, 58, 60, 0.96);
    --fill2: rgba(120, 120, 128, 0.32);
    --green: #30D158;
    --orange: #FF9F0A;
  }
}

/* ===== [BASE] ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--label);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.3;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  word-break: keep-all;      /* 한글 단어 중간에서 줄바꿈하지 않기 */
  overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; -webkit-user-select: text; user-select: text; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
svg { display: block; }

#app { position: fixed; inset: 0; overflow: hidden; }

/* ===== [SCREEN & TRANSITION] ===== */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.screen.push { animation: pushIn 0.3s var(--ease); z-index: 2; }
.screen.pop { animation: popIn 0.3s var(--ease); }
.screen.behind { pointer-events: none; animation: behindOut 0.3s var(--ease) forwards; z-index: 1; }
@keyframes pushIn { from { transform: translateX(100%); } to { transform: none; } }
@keyframes popIn { from { transform: translateX(-30%); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes behindOut { to { transform: translateX(-30%); opacity: 0.6; } }

/* ===== [NAVBAR] 큰 제목 → 스크롤 시 작은 제목 ===== */
.navbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 10;
  padding-top: env(safe-area-inset-top, 0px);
  border-bottom: 0.5px solid transparent;
  transition: background-color 0.2s, border-color 0.2s;
}
.navbar.scrolled, .navbar.solid {
  background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom-color: var(--sep);
}
.navbar-inner { height: 44px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 4px; }
.nav-left { justify-self: start; min-width: 0; }
.nav-right { justify-self: end; }
.nav-title {
  font-weight: 600; max-width: 56vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; transition: opacity 0.15s;
}
.navbar.scrolled .nav-title, .navbar.solid .nav-title { opacity: 1; }
.nav-btn { color: var(--accent); min-height: 44px; min-width: 44px; padding: 0 10px; display: inline-flex; align-items: center; }
.nav-btn.bold { font-weight: 600; }
.nav-btn:active { opacity: 0.4; }
.nav-btn.back { padding-left: 2px; gap: 0; max-width: 38vw; }
.nav-btn.back svg { width: 28px; height: 28px; flex: none; stroke-width: 2.4; }
.back-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding-top: calc(44px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
}
.large-title { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; margin: 2px 20px 10px; line-height: 1.2; }

/* ===== [SEARCH] ===== */
.searchbar {
  margin: 0 16px 6px; height: 38px; padding: 0 6px 0 8px;
  display: flex; align-items: center; gap: 6px;
  background: var(--fill); border-radius: 10px; color: var(--label2);
}
.searchbar > svg { width: 18px; height: 18px; flex: none; }
.searchbar input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 17px; color: var(--label); }
.searchbar input::placeholder { color: var(--label2); }
.clear-btn { width: 32px; height: 32px; display: grid; place-items: center; color: var(--label3); flex: none; }
.clear-btn svg { width: 20px; height: 20px; }

/* ===== [GROUPED LIST] ===== */
.group-header { margin: 24px 32px 7px; font-size: 13px; color: var(--label2); }
.group-footer { margin: 7px 32px 0; font-size: 13px; line-height: 1.4; color: var(--label2); }
.group { margin: 0 16px; background: var(--cell); border-radius: 10px; overflow: hidden; }
.group + .group { margin-top: 24px; }
.spacer { height: 18px; }

.row { position: relative; display: flex; align-items: center; min-height: 48px; }
.row::after {
  content: ""; position: absolute; bottom: 0; right: 0; height: 0.5px; background: var(--sep);
  left: calc(var(--indent, 16px) + 42px);
}
.row:last-child::after { display: none; }
.row-hit {
  flex: 1; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 10px;
  padding: 6px 12px 6px var(--indent, 16px); text-align: left;
}
.row-hit:active, .row-btn:active { background: var(--pressed); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-main .row-title + .row-sub { margin-top: 1px; }
.row-sub { font-size: 14px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { color: var(--label2); font-size: 15px; flex: none; }
.chev { width: 18px; height: 18px; color: var(--label3); flex: none; stroke-width: 2.6; }
.disclosure { width: 18px; height: 18px; color: var(--accent); flex: none; stroke-width: 2.6; transition: transform 0.2s var(--ease); }
.open .disclosure { transform: rotate(90deg); }
.folder-icon { width: 26px; height: 26px; color: var(--accent); flex: none; stroke-width: 1.8; }
.folder-row .row-title { flex: 1; }

.tile {
  width: 30px; height: 30px; border-radius: 7px; flex: none;
  display: grid; place-items: center; color: #FFFFFF; font-weight: 600; font-size: 15px;
}

.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--accent); flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { opacity: 0.4; }
.icon-btn:disabled { color: var(--label3); opacity: 1; }

.row-btn { width: 100%; min-height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 10px; text-align: left; }
.row-btn { position: relative; }
.row-btn + .row-btn::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--sep); }
.row-btn.center { justify-content: center; color: var(--accent); }
.row-btn .row-title { flex: 1; }
.danger { color: var(--danger) !important; }

/* ===== [DETAIL] ===== */
.hero { display: flex; flex-direction: column; align-items: center; padding: 6px 24px 4px; text-align: center; }
.hero .tile { width: 76px; height: 76px; border-radius: 17px; font-size: 34px; }
.hero-title { font-size: 24px; font-weight: 700; margin-top: 12px; }
.hero-sub { font-size: 15px; color: var(--label2); margin-top: 3px; word-break: break-all; }

.kv { position: relative; display: flex; align-items: center; min-height: 58px; padding: 8px 6px 8px 16px; }
.kv::after { content: ""; position: absolute; left: 16px; right: 0; bottom: 0; height: 0.5px; background: var(--sep); }
.kv:last-child::after { display: none; }
.kv-main { flex: 1; min-width: 0; }
.kv-label { font-size: 13px; color: var(--label2); margin-bottom: 2px; }
.kv-value { word-break: break-all; -webkit-user-select: text; user-select: text; }
.kv-value.empty { color: var(--label3); }
.kv-value.masked { letter-spacing: 0.12em; }
.kv-value.mono { font-family: var(--mono); font-size: 16px; }
.memo-text { padding: 12px 16px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; -webkit-user-select: text; user-select: text; }

/* ===== [EDIT FORM] ===== */
.field { position: relative; display: flex; align-items: center; min-height: 48px; padding-left: 16px; gap: 12px; }
.field::after { content: ""; position: absolute; left: 16px; right: 0; bottom: 0; height: 0.5px; background: var(--sep); }
.field:last-child::after { display: none; }
.field label { width: 76px; flex: none; }
.field input { flex: 1; min-width: 0; height: 48px; border: 0; outline: none; background: transparent; font-size: 17px; padding-right: 16px; }
.field input::placeholder, .memo-input::placeholder { color: var(--label3); }
.field .icon-btn + input, .field input + .icon-btn { margin-left: -12px; }
.memo-input {
  display: block; width: 100%; min-height: 132px; border: 0; outline: none; resize: vertical;
  background: transparent; padding: 12px 16px; font-size: 17px; line-height: 1.45;
}

/* ===== [TOOLBAR] ===== */
.toolbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--sep);
}
.toolbar-inner { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
.toolbar-text { font-size: 12px; color: var(--label2); }
.toolbar .icon-btn svg { width: 26px; height: 26px; }

.empty { text-align: center; color: var(--label2); font-size: 15px; line-height: 1.5; padding: 48px 36px; margin: 0; }
.stage-note { text-align: center; color: var(--label3); font-size: 12px; line-height: 1.5; margin: 28px 32px 0; }

/* ===== [OVERLAYS] 시트 · 알림창 · 토스트 ===== */
.overlay { position: fixed; inset: 0; z-index: 50; }
.backdrop { position: absolute; inset: 0; background: var(--dim); }
.backdrop.enter { animation: fadeIn 0.2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } }

.sheet {
  position: absolute; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px; max-height: 86%;
}
.sheet.enter { animation: slideUp 0.32s var(--ease); }
@keyframes slideUp { from { transform: translateY(110%); } }
.sheet-group { background: var(--sheet); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.sheet-title { padding: 14px 20px; text-align: center; font-size: 13px; line-height: 1.4; color: var(--label2); border-bottom: 0.5px solid var(--sep); flex: none; }
.sheet-btn { width: 100%; min-height: 57px; font-size: 19px; color: var(--accent); border-bottom: 0.5px solid var(--sep); padding: 0 16px; }
.sheet-btn:last-child { border-bottom: 0; }
.sheet-btn:active { background: var(--pressed); }
.sheet-btn:disabled { color: var(--label3); }
.sheet-btn.cancel { font-weight: 600; }
.sheet-list { overflow-y: auto; min-height: 0; }
.pick-row {
  width: 100%; min-height: 50px; display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 0 16px 0 var(--indent, 16px); border-bottom: 0.5px solid var(--sep); font-size: 17px;
}
.pick-row:last-child { border-bottom: 0; }
.pick-row:active { background: var(--pressed); }
.pick-row:disabled { color: var(--label3); }
.pick-row:disabled .folder-icon { color: var(--label3); }
.pick-row .row-title { flex: 1; }
.pick-row .check { width: 22px; height: 22px; color: var(--accent); flex: none; stroke-width: 2.6; }

.alert {
  position: absolute; top: 50%; left: 50%; width: 280px; transform: translate(-50%, -50%);
  background: var(--sheet); border-radius: 14px; overflow: hidden; text-align: center;
}
.alert.enter { animation: alertIn 0.2s ease-out; }
@keyframes alertIn { from { transform: translate(-50%, -50%) scale(1.12); opacity: 0; } }
.alert-body { padding: 20px 16px 16px; }
.alert-title { font-weight: 600; font-size: 17px; }
.alert-msg { font-size: 13px; line-height: 1.4; margin-top: 4px; white-space: pre-line; }
.alert-input {
  width: 100%; height: 34px; margin-top: 14px; padding: 0 8px;
  border: 0.5px solid var(--sep); border-radius: 7px; background: var(--cell); font-size: 15px; outline: none;
}
.alert-actions { display: flex; border-top: 0.5px solid var(--sep); }
.alert-btn { flex: 1; min-height: 46px; color: var(--accent); }
.alert-btn + .alert-btn { border-left: 0.5px solid var(--sep); }
.alert-actions.stack { flex-direction: column; }
.alert-actions.stack .alert-btn + .alert-btn { border-left: 0; border-top: 0.5px solid var(--sep); }
.alert-btn.bold { font-weight: 600; }
.alert-btn:active { background: var(--pressed); }

.toast {
  position: fixed; left: 12px; right: 12px; z-index: 40;
  bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  min-height: 50px; padding: 4px 4px 4px 16px; border-radius: 13px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--toast); color: #FFFFFF; font-size: 15px;
}
.toast.low { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.toast.enter { animation: toastIn 0.25s var(--ease); }
@keyframes toastIn { from { transform: translateY(20px); opacity: 0; } }
.toast button { color: #64B5FF; font-weight: 600; min-height: 44px; padding: 0 12px; flex: none; }

/* ===== [2단계] 금고 만들기 · 잠금 해제 · 설정 ===== */
.clear-btn.hidden { visibility: hidden; }
.nav-left .icon-btn svg { width: 24px; height: 24px; }
.scroll.center { display: grid; place-items: center; }
.lock-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 28px 22px; }
.app-mark { width: 76px; height: 76px; border-radius: 17px; background: var(--accent); color: #FFFFFF; display: grid; place-items: center; }
.app-mark svg { width: 40px; height: 40px; stroke-width: 1.8; }
.lock-text { color: var(--label2); font-size: 15px; line-height: 1.45; margin: 8px 0 0; max-width: 30em; }
.primary-btn {
  display: block; width: calc(100% - 32px); margin: 24px 16px 0; min-height: 52px; border-radius: 13px;
  background: var(--accent); color: #FFFFFF; font-size: 17px; font-weight: 600;
}
.primary-btn:active { opacity: 0.7; }
.error-text { color: var(--danger); font-size: 14px; line-height: 1.4; margin: 12px 32px 0; }
.group-footer.warn { color: var(--orange); }

.toggle-row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; }
.toggle-row::after { content: ""; position: absolute; left: 16px; right: 0; bottom: 0; height: 0.5px; background: var(--sep); }
.toggle-row:last-child::after { display: none; }
.toggle-text { flex: 1; font-size: 16px; line-height: 1.35; }
.switch {
  -webkit-appearance: none; appearance: none; flex: none; margin: 0; cursor: pointer;
  width: 51px; height: 31px; border-radius: 16px; background: var(--fill2); position: relative; transition: background-color 0.2s;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #FFFFFF; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16);
  transition: transform 0.2s var(--ease);
}
.switch:checked { background: var(--green); }
.switch:checked::after { transform: translateX(20px); }

.strength { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.strength-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.strength-fill { height: 100%; width: 0; border-radius: 3px; transition: width 0.2s var(--ease); }
.strength-fill.lv1 { width: 33%; background: var(--danger); }
.strength-fill.lv2 { width: 66%; background: var(--orange); }
.strength-fill.lv3 { width: 100%; background: var(--green); }
.strength-label { width: 40px; text-align: right; font-size: 13px; color: var(--label2); }

.spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--fill2); border-top-color: var(--label2); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.busy { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--dim); }
.busy-box { min-width: 170px; padding: 22px 26px; border-radius: 14px; background: var(--sheet); display: flex; flex-direction: column; align-items: center; gap: 14px; font-size: 15px; }

.kv-value.small { font-size: 13px; color: var(--label2); }
.result { width: 28px; height: 28px; flex: none; display: grid; place-items: center; margin-right: 10px; }
.result svg { width: 22px; height: 22px; stroke-width: 2.6; }
.result.ok { color: var(--green); }
.result.fail { color: var(--danger); }
.result.info { color: var(--label3); }

/* ===== [3단계] 백업 · 복원 · 가져오기 ===== */
.banner { margin: 14px 16px 0; padding: 14px 16px 4px; border-radius: 12px; background: var(--cell); }
.banner-title { font-weight: 600; font-size: 16px; }
.banner-text { font-size: 14px; line-height: 1.4; color: var(--label2); margin-top: 3px; }
.banner-actions { display: flex; justify-content: flex-end; margin-right: -10px; }
.text-btn { display: block; margin: 14px auto 0; min-height: 44px; padding: 0 16px; color: var(--accent); font-size: 16px; }
.text-btn:active { opacity: 0.4; }
.primary-btn.destructive { background: var(--danger); }
.app-mark.warn-mark { background: var(--orange); }
.warn-box .memo-text strong { color: var(--danger); }

/* ===== [4단계] 생성기 · 화면 가림 ===== */
.gen-box { display: flex; align-items: center; gap: 4px; padding: 14px 6px 14px 16px; min-height: 76px; }
.gen-preview { flex: 1; min-width: 0; font-family: var(--mono); font-size: 21px; line-height: 1.35; word-break: break-all; -webkit-user-select: text; user-select: text; }
.gen-slider { position: relative; padding: 12px 16px 14px; }
.gen-slider::after { content: ""; position: absolute; left: 16px; right: 0; bottom: 0; height: 0.5px; background: var(--sep); }
.gen-slider-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.gen-slider input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); height: 28px; }
.privacy-cover { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg); }

/* ===== [1.1] 비밀번호 엿보기 · 경고 배너 ===== */
.pw-peek { padding: 0 16px 12px 104px; margin-top: -4px; font-family: var(--mono); font-size: 16px; color: var(--label); word-break: break-all; -webkit-user-select: none; user-select: none; }
.banner.warn-banner { background: color-mix(in srgb, var(--danger) 14%, var(--cell)); }
.banner.warn-banner .banner-title { color: var(--danger); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">이 앱은 JavaScript가 필요합니다.</p></noscript>
<script src="app.js"></script>
</body>
</html>
